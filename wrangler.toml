name = "eu-tax-saas"
# Cloudflare 从零资源创建顺序见 docs/CLOUDFLARE-SETUP-OVERVIEW.md
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Static assets — the Solid SPA built by `pnpm build:app` into dist/app/.
# Served at /app/* on taxmora.com; requests that don't match an asset fall
# through to the Worker (API + landing pages).
assets = { directory = "./dist", binding = "ASSETS" }

# D1 - Primary database (SQLite at the edge)
[[d1_databases]]
binding = "DB"
database_name = "eu-tax-saas-db"
database_id = "d9b652fc-0183-44ab-9f4f-c8e9b341b3fe"
migrations_dir = "drizzle/migrations"

# KV - Cache and rate limiter storage (Better Auth requires this)
[[kv_namespaces]]
binding = "KV"
id = "1e407b97d4214ec38d93906f4643964f"
preview_id = "961c6acd44c34f938a435a13fddd48a5"

# R2 - PDF storage (tax form templates + generated PDFs)
[[r2_buckets]]
binding = "R2"
bucket_name = "eu-tax-saas-pdfs"
preview_bucket_name = "eu-tax-saas-pdfs-preview"

[[vectorize]]
binding = "VECTORIZE"
index_name = "tax-law"

# Workers AI - For toMarkdown PDF parsing and BGE-M3 embeddings (future)
[ai]
binding = "AI"

# Queues - Async work (email sending, PDF generation)
[[queues.producers]]
binding = "QUEUE"
queue = "eu-tax-saas-jobs"

# [[queues.consumers]]
# queue = "eu-tax-saas-jobs"
# max_batch_size = 10
# max_batch_timeout = 30
# NOTE: consumer handler not yet implemented in src/index.ts

# Vars (non-secret config)
[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
# 促销开关（付费墙豁免，见 src/api/middleware/subscription.ts 的 isBetaAllPro）：
# "false" = 正常收费（Beta 期即按 €29/年创始价收费，默认值）；
# "true" = 促销期，所有登录用户免 Pro 费（全员 Pro）。仅促销活动时临时打开。
BETA_ALL_PRO = "false"

# Observability
[observability]
enabled = true

# Limits (paid plan only; commented for free plan)
# [limits]
# cpu_ms = 50

# F9 — Daily deadline reminder cron (09:00 UTC)

# === Staging environment ===
[env.staging]
name = "eu-tax-saas-staging"
[env.staging.vars]
ENVIRONMENT = "staging"
APP_URL = "https://staging.eu-tax-saas.com"
# 促销开关：默认 false 正常收费（€29/年创始价）；true = 促销期登录用户全免 Pro 费。
BETA_ALL_PRO = "false"

# === Production environment ===
[env.production]
name = "eu-tax-saas-prod"

[env.production.vars]
ENVIRONMENT = "production"
APP_URL = "https://taxmora.com"
# 促销开关：默认 false 正常收费（€29/年创始价）；true = 促销期登录用户全免 Pro 费。
BETA_ALL_PRO = "false"

[[env.production.routes]]
pattern = "taxmora.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.taxmora.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "eu-tax-saas-db"
database_id = "d9b652fc-0183-44ab-9f4f-c8e9b341b3fe"
migrations_dir = "drizzle/migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "1e407b97d4214ec38d93906f4643964f"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "eu-tax-saas-pdfs"

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "tax-law"

[env.production.ai]
binding = "AI"

[[env.production.queues.producers]]
binding = "QUEUE"
queue = "eu-tax-saas-jobs"

# Secrets (set via `wrangler secret put`; see docs/CLOUDFLARE-SETUP-OVERVIEW.md):
# - BETTER_AUTH_SECRET (32+ char random string)
# - PADDLE_API_KEY
# - PADDLE_WEBHOOK_SECRET
# - CREEM_API_KEY
# - DEEPSEEK_API_KEY (via AI Gateway)
# - AI_GATEWAY_ACCOUNT_ID
# - AI_GATEWAY_NAME
